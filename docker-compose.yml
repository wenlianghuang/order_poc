services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderservice
    ports:
      - "5433:5432"
    volumes:
      - orderservice-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  order:
    build:
      context: .
      dockerfile: src/OrderService.Api/Dockerfile
    ports:
      - "5064:5064"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=orderservice;Username=postgres;Password=postgres
      Shipments__BaseAddress: http://shipment:5065
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  shipment:
    build:
      context: .
      dockerfile: src/ShipmentService.Api/Dockerfile
    ports:
      - "5065:5065"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=shipments;Username=postgres;Password=postgres
      Orders__BaseAddress: http://order:5064
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  orderservice-pg:
