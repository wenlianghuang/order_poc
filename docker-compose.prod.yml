name: order-poc

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: orderservice
    volumes:
      - orderservice-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  order:
    image: ${ORDER_IMAGE:?ORDER_IMAGE is required}
    environment:
      ConnectionStrings__DefaultConnection: ${ORDER_DB:?ORDER_DB is required}
      Shipments__BaseAddress: http://shipment:5065
      Auth__Issuer: ${AUTH_ISSUER:-OrderService}
      Auth__Audience: ${AUTH_AUDIENCE:-OrderService}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY is required}
      Auth__TokenLifetimeMinutes: ${AUTH_TOKEN_LIFETIME_MINUTES:-60}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${ORDER_PORT:-5064}:5064"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  shipment:
    image: ${SHIPMENT_IMAGE:?SHIPMENT_IMAGE is required}
    environment:
      ConnectionStrings__DefaultConnection: ${SHIPMENT_DB:?SHIPMENT_DB is required}
      Orders__BaseAddress: http://order:5064
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${SHIPMENT_PORT:-5065}:5065"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orderservice-pg:
