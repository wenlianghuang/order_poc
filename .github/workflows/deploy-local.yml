# After CI publishes both images from a main push, update this Mac.
# The job stays queued while the self-hosted runner is offline.
# A v* tag still uses deploy.yml over SSH and does not run this workflow.

name: Deploy local

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag already in GHCR (sha-abcdef1 or latest)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-local
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy local
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pull images and start
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: sh ./deploy/local-up.sh
